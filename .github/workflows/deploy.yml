name: Build & deploy Community Wall

# Runs only after a merge to main (never on untrusted PR code).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate data/participants.json (invalid files are skipped, never break the wall)
        run: node scripts/build-participants.js
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html learn.html resources.html css js data participants materials _site/
          touch _site/.nojekyll
          # cache-bust css/js so a stale browser cache can never mix old assets with new pages
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" _site/*.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
